apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: freeshop
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/dipjitbaroi/freeshop-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Environment & Port Configuration (from ConfigMap)
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: API_GATEWAY_PORT
            - name: API_GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: API_GATEWAY_PORT
            # Redis Configuration
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeshop-secrets
                  key: REDIS_PASSWORD
            # RabbitMQ Configuration
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: freeshop-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: freeshop-secrets
                  key: RABBITMQ_PASS
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: freeshop-secrets
                  key: JWT_SECRET
            # Service-to-service URLs are derived from ConfigMap-exposed
            # service name + port so they stay consistent with freeshop-config.
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:$(AUTH_SERVICE_PORT)"
            - name: USER_SERVICE_URL
              value: "http://user-service:$(USER_SERVICE_PORT)"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:$(PRODUCT_SERVICE_PORT)"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:$(ORDER_SERVICE_PORT)"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:$(PAYMENT_SERVICE_PORT)"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:$(INVENTORY_SERVICE_PORT)"
            - name: VENDOR_SERVICE_URL
              value: "http://vendor-service:$(VENDOR_SERVICE_PORT)"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:$(NOTIFICATION_SERVICE_PORT)"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service:$(ANALYTICS_SERVICE_PORT)"
            - name: PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: PUBLIC_API_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: CORS_ORIGIN
            # Rate limiting — general API tier (anonymous storefront traffic)
            - name: RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: RATE_LIMIT_WINDOW_MS
            - name: RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: RATE_LIMIT_MAX_REQUESTS
            # Rate limiting — admin/manager tier (dashboard, bulk operations)
            - name: ADMIN_RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: ADMIN_RATE_LIMIT_WINDOW_MS
            - name: ADMIN_RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: ADMIN_RATE_LIMIT_MAX_REQUESTS
            # Rate limiting — auth (login/register/forgot)
            - name: AUTH_RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: AUTH_RATE_LIMIT_WINDOW_MS
            - name: AUTH_RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: AUTH_RATE_LIMIT_MAX_REQUESTS
            # Rate limiting — file uploads
            - name: UPLOAD_RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: UPLOAD_RATE_LIMIT_WINDOW_MS
            - name: UPLOAD_RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: UPLOAD_RATE_LIMIT_MAX_REQUESTS
            # Rate limiting — webhooks (trusted services only)
            - name: WEBHOOK_RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: WEBHOOK_RATE_LIMIT_WINDOW_MS
            - name: WEBHOOK_RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: freeshop-config-api-gateway
                  key: WEBHOOK_RATE_LIMIT_MAX_REQUESTS
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: freeshop
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: freeshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
