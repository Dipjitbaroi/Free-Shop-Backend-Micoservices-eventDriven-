name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint & type-check every package and service
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      AUTH_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      USER_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      PRODUCT_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      ORDER_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      PAYMENT_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      INVENTORY_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      VENDOR_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      NOTIFICATION_DATABASE_URL: "postgresql://user:pass@localhost/dummy"
      ANALYTICS_DATABASE_URL: "postgresql://user:pass@localhost/dummy"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install root workspace deps
        run: |
          # Ignore ERR_PNPM_IGNORED_BUILDS warning - expected for native modules (Prisma, esbuild, etc.)
          pnpm install --frozen-lockfile || true

      - name: Generate Prisma client for all services
        run: |
          # Generate Prisma clients using each service's local binary
          for SERVICE in services/*/; do
            if [ -f "$SERVICE/prisma/schema.prisma" ]; then
              SERVICE_NAME=$(basename "$SERVICE")
              echo "Generating Prisma client for $SERVICE_NAME..."
              if [ -f "$SERVICE/node_modules/.bin/prisma" ]; then
                $SERVICE/node_modules/.bin/prisma generate --schema "$SERVICE/prisma/schema.prisma" 2>&1 | grep -v "ERR_PNPM_IGNORED_BUILDS" || true
              else
                echo "⚠️ Warning: prisma not found in $SERVICE_NAME, skipping..."
              fi
            fi
          done

      - name: Validate Prisma migrations
        run: |
          EXIT=0
          for SERVICE in services/*/; do
            if [ -f "$SERVICE/prisma/schema.prisma" ]; then
              SERVICE_NAME=$(basename "$SERVICE")
              echo "Validating migrations for $SERVICE_NAME..."
              # Check if migrations directory exists
              if [ ! -d "$SERVICE/prisma/migrations" ]; then
                echo "⚠️ Warning: No migrations directory for $SERVICE_NAME"
              fi
            fi
          done

      - name: Check for schema drift (migrations needed)
        env:
          # Use dummy database URLs for validation only
          AUTH_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          USER_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          PRODUCT_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          ORDER_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          PAYMENT_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          INVENTORY_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          VENDOR_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          NOTIFICATION_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          ANALYTICS_DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
        run: |
          echo "⚠️ Reminder: If you modified any schema.prisma file, please run:"
          echo "   pnpm -C services/<service-name> exec prisma migrate dev --name <migration-name>"
          echo "   Then commit the migration files before pushing"

      - name: Build shared packages first
        run: |
          for PKG in packages/shared-types packages/shared-utils packages/shared-events packages/shared-middleware; do
            echo "Building $PKG..."
            # Compile TypeScript directly to dist/
            (cd "$PKG" && npx tsc) 2>&1 | grep -v "ERR_PNPM_IGNORED_BUILDS" || true
          done

      - name: Verify shared packages built
        run: |
          echo "Checking shared package dist files..."
          for PKG in packages/shared-types packages/shared-utils packages/shared-events packages/shared-middleware; do
            if [ -d "$PKG/dist" ]; then
              echo "✓ $PKG/dist exists"
              ls -la "$PKG/dist" | head -5
            else
              echo "✗ $PKG/dist NOT FOUND - build may have failed"
              ls -la "$PKG" | grep -E "^d"
            fi
          done

      - name: Type-check all services
        run: |
          # Type-check all services using tsc from the workspace root
          EXIT=0
          for SERVICE_DIR in services/*/; do
            if [ -f "$SERVICE_DIR/tsconfig.json" ]; then
              echo "--- Checking $SERVICE_DIR ---"
              npx tsc -p "$SERVICE_DIR" --noEmit 2>&1 | grep -v "ERR_PNPM_IGNORED_BUILDS" || EXIT=$?
            fi
          done
          if [ $EXIT -ne 0 ]; then
            echo "❌ TypeScript errors found!"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Lint Dockerfiles with hadolint
  # ─────────────────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint all Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:latest-alpine hadolint \
            --failure-threshold error - < /dev/null || true
          for DFILE in services/*/Dockerfile; do
            echo "Linting $DFILE"
            docker run --rm -i hadolint/hadolint:latest-alpine hadolint \
              --failure-threshold error - < "$DFILE"
          done

  # ─────────────────────────────────────────────────────────────
  # Build Docker images (no push) to verify Dockerfiles compile.
  # Runs only on PRs targeting main — avoids redundant builds on
  # every dev push (the deploy pipeline handles actual pushes).
  # ─────────────────────────────────────────────────────────────
  build-test:
    name: Build test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - inventory-service
          - vendor-service
          - notification-service
          - analytics-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=ci-${{ matrix.service }}
